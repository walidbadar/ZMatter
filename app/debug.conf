# This is a Kconfig fragment which can be used to enable debug-related options
# in the application. See the README for more details.

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_NET_LOG=y
CONFIG_MATTER_LOG_LEVEL_WRN=y

# Thread stack usage, reported by the Matter diagnostics clusters
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
