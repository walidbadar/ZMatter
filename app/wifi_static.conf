# Join a fixed Wi-Fi network at boot instead of receiving the credentials
# over Bluetooth LE during commissioning. The device is then commissioned
# on-network. Pass the credentials at build time (see README):
#   -DEXTRA_CONF_FILE=wifi_static.conf
#   -DCONFIG_WIFI_CREDENTIALS_STATIC_SSID=\"<ssid>\"
#   -DCONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD=\"<password>\"

# Wi-Fi credentials, connected automatically at boot
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y

# No Bluetooth LE commissioning
CONFIG_BT=n
