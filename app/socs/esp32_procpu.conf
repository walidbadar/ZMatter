# ESP32 related configs
CONFIG_ESP32_WIFI_TASK_STACK_SIZE=4096

# The ESP32 has much less internal RAM than the ESP32-S3: Matter, Wi-Fi and
# Bluetooth LE only fit with smaller heaps and buffer pools (Matter pools: see
# src/CHIPProjectConfig.h).

# Kernel heap, used by the Wi-Fi and Bluetooth controller drivers. The
# drivers ask for 80 KB by default, sized for larger buffer pools.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=40960

# Wi-Fi buffers, allocated from the kernel heap
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n

# IP stack: Matter only uses IPv6
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24

# Bluetooth host buffers
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=4

# AES lookup tables in flash instead of 8 KB of RAM
CONFIG_MBEDTLS_AES_ROM_TABLES=y
