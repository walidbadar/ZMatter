# Matter on/off light bulb for native_sim. Matter runs over the host's
# network interfaces (see README).

# C17 for the application, C++17 for Matter and its wrapper (src/matter)
CONFIG_STD_C17=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Kernel
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=36864
CONFIG_INIT_STACKS=y

# Networking: Zephyr IP stack over the ESP32 Wi-Fi station
# Network Configuration
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_DAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16

# Wi-Fi statistics, reported by the Matter Wi-Fi diagnostics cluster
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y

# Wi-Fi management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Wi-Fi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_NM=y

# Bluetooth LE commissioning: the commissioner sends the Wi-Fi credentials
# over BLE, and the device then joins Wi-Fi.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ZMatter"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=15
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CACHING=n
# No pairing or bonding: a new random static address is used on every boot
CONFIG_BT_BONDABLE=n
CONFIG_BT_SETTINGS=n

# Large ATT MTU for the Matter BLE transport (BTP)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_RX_STACK_SIZE=2048

# Fast connection parameter updates: some commissioners switch to IP quickly
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=36
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=36
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000

# Enable LED drivers
CONFIG_LED=y

# Persistent storage (backed by the simulated flash, flash.bin)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Crypto: PSA API from TF-PSA-Crypto, X.509 from Mbed TLS
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_ENTROPY_GENERATOR=y

# Matter
CONFIG_CHIP=y
CONFIG_CHIP_WIFI=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_CRYPTO_PSA=y
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_DEVICE_PRODUCT_NAME="ZMatter Light"
CONFIG_CHIP_DEVICE_TYPE=256
CONFIG_CHIP_PROJECT_CONFIG="src/CHIPProjectConfig.h"
CONFIG_OPENTHREAD=n
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_MCUMGR=n
