# On native_sim Matter uses the host's sockets directly, so the Zephyr IP
# stack and Wi-Fi from prj.conf are not needed.

# Matter over the host network instead of Wi-Fi
CONFIG_CHIP_ETHERNET=y
CONFIG_CHIP_WIFI=n

# Networking: disables the IP stack, sockets, net_mgmt and net statistics
CONFIG_NETWORKING=n

# Wi-Fi and the stored credentials
CONFIG_WIFI=n
CONFIG_WIFI_NM=n
CONFIG_WIFI_CREDENTIALS=n
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=n
