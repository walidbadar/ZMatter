# VIEWE UEDX32480035E-WB-A: Matter over Wi-Fi, WS2812 RGB LED as the bulb.
#
# The device joins the Wi-Fi network at boot. Pass the credentials at build
# time instead of committing them (see README):
#   -DCONFIG_WIFI_CREDENTIALS_STATIC_SSID=\"<ssid>\"
#   -DCONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD=\"<password>\"

# Thread stack usage, reported by the Matter diagnostics clusters
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Light bulb: WS2812 RGB LED
CONFIG_LED_STRIP=y

# Networking: Zephyr IP stack over the ESP32 Wi-Fi station
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_DAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Wi-Fi statistics, reported by the Matter Wi-Fi diagnostics cluster
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y

# Wi-Fi credentials, connected automatically at boot
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y

# Matter over Wi-Fi instead of the host sockets used on native_sim
CONFIG_CHIP_ETHERNET=n
CONFIG_CHIP_WIFI=y
